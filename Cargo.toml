[package]
name = "star-picket-retro"
version = "0.1.0"
edition = "2024"

[features]
# park a station next to the start position (screenshots, testing)
showcase = []
# play every pitched instrument at every note, to check the mixer copes
soundcheck = []
# one ship that explodes 3 seconds in, to reach Game Over quickly when testing the menus
quickover = []

[dependencies]
agb = "0.25.0"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
opt-level = 3
debug = true

[profile.release]
opt-level = 3
lto = "fat"
debug = true
panic = "abort"
